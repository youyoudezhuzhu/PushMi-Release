name: Bug Report / 问题反馈
description: 报告 PushMi 的问题
title: "[Bug] "
labels: ["bug"]
body:
  - type: input
    id: app_version
    attributes: {label: App 版本}
    validations: {required: true}
  - type: input
    id: android
    attributes: {label: Android 版本}
    validations: {required: true}
  - type: input
    id: phone
    attributes: {label: 手机型号}
    validations: {required: true}
  - type: input
    id: speaker
    attributes: {label: 音箱型号}
    validations: {required: true}
  - type: textarea
    id: desc
    attributes: {label: 问题描述}
    validations: {required: true}
  - type: textarea
    id: steps
    attributes: {label: 复现步骤}
    validations: {required: true}
  - type: dropdown
    id: reproducible
    attributes:
      label: 是否可以稳定复现
      options: ["可以稳定复现", "偶尔出现", "仅一次"]
    validations: {required: true}
  - type: textarea
    id: logs
    attributes:
      label: 可选诊断日志
      description: 请先脱敏；不要上传 CDK、Token、完整授权凭证、私密音频或设备隐私信息。
      render: text
