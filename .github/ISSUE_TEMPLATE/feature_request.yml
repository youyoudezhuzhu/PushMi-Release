name: Feature Request / 功能建议
description: 提出功能建议
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: feature
    attributes: {label: 希望增加的功能}
    validations: {required: true}
  - type: textarea
    id: scenario
    attributes: {label: 使用场景}
    validations: {required: true}
  - type: textarea
    id: pain
    attributes: {label: 当前操作的不便}
    validations: {required: true}
  - type: textarea
    id: expected
    attributes: {label: 预期行为}
    validations: {required: true}
