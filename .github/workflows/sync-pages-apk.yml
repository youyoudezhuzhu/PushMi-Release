name: Sync latest APK to GitHub Pages

# Runs whenever a stable release is published, and can be re-run manually.
# Pages is deployed as an artifact (Settings → Pages → Source: GitHub Actions),
# so the ~6 MB latest.apk is NOT committed to git: the repository history no
# longer grows by one APK per release. Only the small stable.json / checksum
# files are committed (the app reads stable.json from raw.githubusercontent).
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to sync (defaults to the latest non-prerelease)
        required: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  sync:
    if: github.event_name == 'workflow_dispatch' || github.event.release.prerelease == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Resolve release tag
        id: rel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_TAG:-}" ]; then
            tag="$INPUT_TAG"
          else
            tag="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq '.tagName')"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          mkdir -p /tmp/rel
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json body --jq .body > /tmp/rel/notes.md 2>/dev/null || true
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name'

      - name: Download release manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.rel.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/rel
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern 'update-manifest.json' --dir /tmp/rel
          python3 .github/scripts/write_meta.py /tmp/rel/update-manifest.json /tmp/rel/meta.env

      - name: Stage APK into the Pages artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.rel.outputs.tag }}
        run: |
          set -euo pipefail
          source /tmp/rel/meta.env
          apk_name="pushmi-${VERSION}-release-signed.apk"
          mkdir -p docs/dl
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern 'pushmi-*-release-signed.apk' --dir /tmp/rel
          got="$(find /tmp/rel -name 'pushmi-*-release-signed.apk' | head -1)"
          echo "sha of asset: $(sha256sum "$got" | awk '{print $1}')"
          echo "sha in manifest: $SHA256"
          [ "$(sha256sum "$got" | awk '{print $1}')" = "$SHA256" ] || { echo "APK sha mismatch"; exit 1; }
          find docs/dl -maxdepth 1 -type f -name 'pushmi-*-release-signed.apk' -delete
          find docs/dl -maxdepth 1 -type f -name 'SHA256SUMS-*.txt' -delete
          cp "$got" docs/dl/latest.apk
          printf '%s  %s\n' "$SHA256" "$apk_name" > "docs/dl/SHA256SUMS-${VERSION}.txt"

          python3 .github/scripts/patch_stable.py "$VERSION" "$VERSION_CODE" "$SHA256" "$TAG" "$apk_name" "${SOURCE_COMMIT:-}" "$(cat /tmp/rel/notes.md 2>/dev/null || true)"

      # Keep exactly one public release: the tag just synced. Release assets are
      # the only per-version copy now (Pages serves a single latest.apk).
      - name: Delete older releases and tags
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KEEP_TAG: ${{ steps.rel.outputs.tag }}
        run: |
          set -euo pipefail
          gh release list --repo "$GITHUB_REPOSITORY" --limit 100 \
            --json tagName --jq '.[].tagName' | while read -r tag; do
            [ -z "$tag" ] && continue
            [ "$tag" = "$KEEP_TAG" ] && continue
            echo "deleting release $tag"
            gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || \
              echo "::warning::could not delete release $tag"
          done
          echo "releases now:"
          gh release list --repo "$GITHUB_REPOSITORY" --limit 100

      - name: Commit stable.json and checksum (no APK)
        run: |
          set -euo pipefail
          source /tmp/rel/meta.env
          git config user.name "PushMi Pages Bot"
          git config user.email "pages-bot@pushmi.local"
          git add -A updates docs/dl
          if [ -z "$(git status --porcelain)" ]; then
            echo "already in sync"
            exit 0
          fi
          git commit -m "pages: sync ${VERSION} metadata (auto)"
          git push origin HEAD:main

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: sync
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
